name: Build & Deploy Midlife App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: prod   # IMPORTANT: Enables environment secrets

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Webapp Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.webapp
          push: true
          tags: |
            maaz124/midlife-app:latest
            maaz124/midlife-app:${{ github.sha }}

      - name: Build & Push DB Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.db
          push: true
          tags: |
            maaz124/midlife-db:latest
            maaz124/midlife-db:${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /root/midlifewellness

            echo "Pulling latest Docker images..."
            docker compose pull

            echo "Starting updated containers..."
            docker compose up -d

            echo "Cleaning old images..."
            docker image prune -f

            echo "Deployment complete."
