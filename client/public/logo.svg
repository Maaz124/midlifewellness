<svg
  width="100"
  height="100"
  viewBox="0 0 100 100"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Outer circle representing wholeness and balance -->
  <circle
    cx="50"
    cy="50"
    r="48"
    stroke="url(#gradient1)"
    stroke-width="3"
    fill="none"
    opacity="0.8"
  />
  
  <!-- Inner petals representing growth and transformation -->
  <g transform="translate(50,50)">
    <!-- Petal 1 - Mental wellness -->
    <path
      d="M0,-25 Q15,-35 25,-20 Q15,-5 0,-15 Q-15,-5 -25,-20 Q-15,-35 0,-25"
      fill="url(#gradient2)"
      opacity="0.9"
    />
    
    <!-- Petal 2 - Physical wellness (rotated 120°) -->
    <path
      d="M0,-25 Q15,-35 25,-20 Q15,-5 0,-15 Q-15,-5 -25,-20 Q-15,-35 0,-25"
      fill="url(#gradient3)"
      opacity="0.9"
      transform="rotate(120)"
    />
    
    <!-- Petal 3 - Cognitive wellness (rotated 240°) -->
    <path
      d="M0,-25 Q15,-35 25,-20 Q15,-5 0,-15 Q-15,-5 -25,-20 Q-15,-35 0,-25"
      fill="url(#gradient4)"
      opacity="0.9"
      transform="rotate(240)"
    />
  </g>
  
  <!-- Center circle representing inner strength -->
  <circle
    cx="50"
    cy="50"
    r="8"
    fill="url(#gradient5)"
  />
  
  <!-- Subtle sparkles for transformation energy -->
  <circle cx="25" cy="25" r="2" fill="url(#gradient6)" opacity="0.6" />
  <circle cx="75" cy="25" r="1.5" fill="url(#gradient6)" opacity="0.7" />
  <circle cx="75" cy="75" r="2" fill="url(#gradient6)" opacity="0.6" />
  <circle cx="25" cy="75" r="1.5" fill="url(#gradient6)" opacity="0.7" />
  
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(261, 73%, 66%)" />
      <stop offset="50%" stop-color="hsl(14, 86%, 76%)" />
      <stop offset="100%" stop-color="hsl(140, 20%, 65%)" />
    </linearGradient>
    
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(261, 73%, 66%)" />
      <stop offset="100%" stop-color="hsl(261, 73%, 80%)" />
    </linearGradient>
    
    <linearGradient id="gradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(14, 86%, 76%)" />
      <stop offset="100%" stop-color="hsl(14, 86%, 85%)" />
    </linearGradient>
    
    <linearGradient id="gradient4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(140, 20%, 65%)" />
      <stop offset="100%" stop-color="hsl(140, 20%, 75%)" />
    </linearGradient>
    
    <linearGradient id="gradient5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(142, 76%, 36%)" />
      <stop offset="100%" stop-color="hsl(142, 76%, 46%)" />
    </linearGradient>
    
    <linearGradient id="gradient6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(45, 93%, 47%)" />
      <stop offset="100%" stop-color="hsl(45, 93%, 57%)" />
    </linearGradient>
  </defs>
</svg>
