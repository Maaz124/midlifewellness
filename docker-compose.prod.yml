services:
  db:
    image: maaz124/midlife-db:latest
    container_name: midlifewellness-postgres
    restart: unless-stopped
    # Security: All credentials from environment variables (via .env file)
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-midlife}
    # Security: NO external port mapping - database only accessible within Docker network
    # ports: REMOVED - database is internal-only for security
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Security: Read-only root filesystem except for data directory and runtime files
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
      - /run/postgresql
    security_opt:
      - no-new-privileges:true
    # Security: Run as postgres user (non-root) - postgres user is configured in base image
    # The postgres:16-alpine image already runs as non-root by default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - midlifewellness-network
    # Security: Disable any interactive shell access
    stdin_open: false
    tty: false

  webapp:
    image: maaz124/midlife-app:latest
    container_name: midlifewellness-webapp
    restart: unless-stopped
    ports:
      - "5003:5000"  # External port 6000 maps to internal port 5000
    environment:
      - NODE_ENV=production
      - PORT=5000
      # Database connection - INSIDE Docker network, use service name 'db' and port 5432 (internal)
      # Security: Use environment variables for credentials, never hardcoded
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-midlife}
      # Session configuration - set SESSION_SECURE=false for HTTP, true for HTTPS
      - SESSION_SECURE=false
      - SESSION_SECRET=${SESSION_SECRET:-change-this-secret}
      # Stripe payment configuration
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      # Email configuration
      - GMAIL_USER=${GMAIL_USER:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
      - COACHING_INBOX=${COACHING_INBOX:-coaching@midliferebalance.com}
    env_file:
      - .env_prodd
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    networks:
      - midlifewellness-network

volumes:
  pgdata:
  uploads:

networks:
  midlifewellness-network:
    driver: bridge
    # Security: Network is isolated - database not accessible from outside Docker network
    # Database service has no exposed ports, only accessible via service name 'db'
