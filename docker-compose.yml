services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: midlifewellness-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=midlife
    ports:
      - "5433:5432"  # External port 5433 maps to internal port 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - midlifewellness-network
    # To use pre-built images from registry instead of building, replace 'build' section with:
    # image: your-registry/midlifewellness-db:latest

  webapp:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    container_name: midlifewellness-webapp
    restart: unless-stopped
    ports:
      - "6000:5000"  # External port 6000 maps to internal port 5000
    environment:
      - NODE_ENV=production
      - PORT=5000
      # Database connection - update DATABASE_URL to use db service name and port 5432 (internal)
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/midlife
      # Add other environment variables as needed
      # - SESSION_SECRET=your-session-secret
      # - GMAIL_USER=your-email
      # - GMAIL_APP_PASSWORD=your-password
      # - COACHING_INBOX=coaching@midliferebalance.com
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    networks:
      - midlifewellness-network
    # To use pre-built images from registry instead of building, replace 'build' section with:
    # image: your-registry/midlifewellness-webapp:latest

volumes:
  pgdata:
  uploads:

networks:
  midlifewellness-network:
    driver: bridge

